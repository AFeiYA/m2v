[pipeline]
skip_separation = false   # 默认由前端 Checkbox 动态控制，未传时默认分离保证最高精度
ass_only = true           # 只生成 ASS + alignment.json，不合成 MP4

[separator]
model = "htdemucs"        # 单模型，速度提升 400%，音质与精细度极佳
two_stems = "vocals"
device = "cuda"
shifts = 1


[aligner]
engine = "stablets"          # "stablets" (stable-ts Whisper 对齐) 或 "ctc" (Wav2Vec2 Forced Alignment)
# GPU 模式：large-v3 + float16（效果最好）
# 若 CUDA 不可用会自动回退 CPU + int8 + medium
whisper_model = "base"
device = "cuda"
compute_type = "float16"
batch_size = 8
language = "auto"
use_pinyin = true             # 中文转拼音后对齐，显著提升字级时间戳精度
lyrics_start_time = 0.0       # 歌词开唱起点 (默认 0.0)
min_char_duration = 0.08      # 单字最短 80ms (歌唱场景比语音更长)
max_char_duration = 20.0       # 单字最长 8s
