name: Suno2MV CI Pipeline

on:
  push:
    branches: [ main, deploy/cloud ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Route Integrity Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov requests gradio

      - name: Run Hugging Face Entrypoint & Route Integrity Test
        run: |
          pytest tests/test_hf_entrypoint.py -v

      - name: Run Full Test Suite
        run: |
          pytest tests/ -v --maxfail=1
