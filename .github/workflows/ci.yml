name: Suno2MV CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_render_tests:
        description: Run real Chromium/FFmpeg rendering acceptance tests
        type: boolean
        default: false

jobs:
  test:
    name: Test & Route Integrity Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/motion/package-lock.json

      - name: Determine whether real rendering is needed
        id: render_scope
        run: python scripts/ci_render_scope.py

      - name: Disable unused Microsoft APT feeds
        # Playwright and ffmpeg need standard Ubuntu packages, not Microsoft's
        # runner-provided feed which returns 403 on Ubuntu 24.04 (noble).
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*dotnet* 2>/dev/null || true
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i '/packages\.microsoft\.com/d' /etc/apt/sources.list 2>/dev/null || true
          fi
          for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ] && sudo grep -q 'packages\.microsoft\.com' "$f"; then
              sudo rm -f "$f"
            fi
          done
          sudo rm -rf /var/lib/apt/lists/*microsoft* /var/lib/apt/lists/*azure* 2>/dev/null || true

      - name: Check and build Motion Studio
        working-directory: frontend/motion
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Install Chromium for render acceptance
        if: steps.render_scope.outputs.run_render_tests == '1'
        working-directory: frontend/motion
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Test Chrome extension and dashboard authentication
        run: node --test chrome_extension/tests/*.test.cjs frontend/tests/*.test.cjs

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov requests gradio ruff

      - name: Run Static Code & Undefined Variables Check (Ruff)
        run: |
          ruff check --select F821 src/ app.py tests/

      - name: Run Hugging Face Entrypoint & Route Integrity Test
        run: |
          pytest tests/test_hf_entrypoint.py -v

      - name: Run Full Test Suite
        env:
          RUN_MOTION_RENDER: ${{ steps.render_scope.outputs.run_render_tests }}
        run: |
          if [ "$RUN_MOTION_RENDER" = "1" ]; then
            export CHROME_PATH=$(cd frontend/motion && node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')
          fi
          pytest tests/ -v --maxfail=1 -m "not local_only"

      - name: Verify Gradio Motion runtime preparation
        if: steps.render_scope.outputs.run_render_tests == '1'
        run: |
          export CHROME_PATH=$(cd frontend/motion && node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')
          python -c 'from src.hf_motion_runtime import prepare_motion_runtime; prepare_motion_runtime()'

      - name: Preserve verified Motion Studio assets
        uses: actions/upload-artifact@v4
        with:
          name: motion-assets
          path: |
            frontend/local/motion/
            frontend/local/remotion/
          if-no-files-found: error

  deploy-to-hf:
    name: Auto Deploy to Hugging Face Spaces
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore verified Motion Studio assets
        uses: actions/download-artifact@v4
        with:
          name: motion-assets
          path: frontend/local

      - name: Include assets in the HF deployment snapshot
        run: |
          test -f frontend/local/motion/studio.js
          test -f frontend/local/remotion/index.html
          rm -f frontend/local/remotion/favicon.ico frontend/local/remotion/*.map
          git config user.name "M2V Deploy"
          git config user.email "m2v-deploy@users.noreply.github.com"
          git add -f frontend/local/motion frontend/local/remotion
          git commit -m "Build Motion Studio assets for HF deployment" || git diff --cached --quiet

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ 错误: 未检测到 HF_TOKEN Secret，请在 GitHub 仓库 Settings -> Secrets 中添加！"
            exit 1
          fi
          echo "🚀 正在向 Hugging Face Spaces 镜像同步最新代码..."
          git push --force "https://LucaZhou:$HF_TOKEN@huggingface.co/spaces/LucaZhou/suno2mv-api" HEAD:refs/heads/main
          echo "✅ 代码与动效资源已同步；请检查 HF 构建与运行日志。"



  deploy-to-pages:
    name: Deploy verified frontend to Cloudflare Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT_NAME != ''
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore verified Motion Studio assets
        uses: actions/download-artifact@v4
        with:
          name: motion-assets
          path: frontend/local

      - name: Check deployment credentials and prepare static frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID Secret"; exit 1; }
          python scripts/prepare_pages.py "$RUNNER_TEMP/pages"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/pages --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
