name: Suno2MV CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Route Integrity Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov requests gradio ruff

      - name: Run Static Code & Undefined Variables Check (Ruff)
        run: |
          ruff check --select F821 src/ app.py tests/

      - name: Run Hugging Face Entrypoint & Route Integrity Test
        run: |
          pytest tests/test_hf_entrypoint.py -v

      - name: Run Full Test Suite
        run: |
          pytest tests/ -v --maxfail=1

  deploy-to-hf:
    name: Auto Deploy to Hugging Face Spaces
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ 错误: 未检测到 HF_TOKEN Secret，请在 GitHub 仓库 Settings -> Secrets 中添加！"
            exit 1
          fi
          echo "🚀 正在向 Hugging Face Spaces 镜像同步最新代码..."
          git push --force "https://LucaZhou:$HF_TOKEN@huggingface.co/spaces/LucaZhou/suno2mv-api" HEAD:refs/heads/main
          echo "✅ Hugging Face Spaces 自动同步部署成功！"
