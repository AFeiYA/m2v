[project]
name = "auto-karaoke-mv"
version = "0.1.0"
description = "Auto-Karaoke MV Generator — Suno MP3 + 歌词 → 卡拉OK变色视频"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # ── 音视频与 AI 对齐引擎 ──
    "whisperx>=3.8.4",
    "stable-ts>=2.19.0",
    "demucs>=4.0.0",
    "librosa>=0.11.0",
    "moviepy>=2.0.0",
    "pillow>=10.0.0",
    # ── 文本与字幕处理 ──
    "pyyaml>=6.0",
    "cn2an>=0.5.22",
    "opencc-python-reimplemented>=0.1.7",
    "chardet>=5.0.0",
    "pypinyin>=0.50.0",
    # ── Web API 与服务 ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "stripe>=16.0.0,<17",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    # ── 数据库与商业授权 ──
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "firebase-admin>=6.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # ── 对象存储 (R2 / S3) ──
    "boto3>=1.35.0",
    # ── 动效渲染 (Playwright) 与 Gradio ──
    "playwright>=1.40.0",
    "gradio>=4.0.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
]
celery = [
    "celery[redis]>=5.4",
    "redis>=5.0",
]
postgres = [
    "asyncpg>=0.30",
    "alembic>=1.13",
]

[project.scripts]
m2v = "src.main:main"
ass2lrc = "src.ass2lrc:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "regression: marks tests as alignment regression tests",
    "local_only: tests requiring private local media, accounts, models or services; excluded from CI",
]

# ── uv 配置: 指定 PyTorch CUDA 源 ──────────────────────
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]
