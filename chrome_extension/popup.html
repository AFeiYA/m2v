<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Fovea MV 动效视频助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #090d16;
      color: #f8fafc;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.25);
      font-weight: 600;
    }
    .card {
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .card-title {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .song-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-row {
      margin-top: 5px;
      font-size: 11px;
      font-weight: 500;
      color: #94a3b8;
      overflow-wrap: anywhere;
    }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      border: none;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.45);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.5);
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #283548;
      color: #f1f5f9;
      border-color: #475569;
    }
    .btn-secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .auth-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
    }
    .auth-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .auth-status-text {
      color: #64748b;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: #64748b;
    }
    .link-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .link-btn:hover {
      color: #94a3b8;
      text-decoration: underline;
    }
    .footer-tip {
      font-size: 10px;
      color: #475569;
      margin-top: 8px;
      line-height: 1.4;
      text-align: center;
    }
    /* 高级自定义设置折叠抽屉 */
    details.advanced-drawer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 10px;
      color: #475569;
    }
    details.advanced-drawer summary {
      cursor: pointer;
      outline: none;
      user-select: none;
      color: #475569;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    details.advanced-drawer summary:hover {
      color: #818cf8;
    }
    .advanced-body {
      padding-top: 8px;
    }
    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 10px;
    }
    .node-btns {
      display: flex;
      gap: 4px;
    }
    .node-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .node-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .node-btn.active {
      background: rgba(99, 102, 241, 0.3);
      border-color: #6366f1;
      color: #a5b4fc;
      font-weight: 600;
    }
    .server-input-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .input-server {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 10px;
    }
    .input-server:focus {
      outline: none;
      border-color: #6366f1;
    }
    .btn-save-server {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-save-server:hover {
      background: #334155;
      color: #f1f5f9;
    }
    a {
      color: #818cf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    details#errorDetails {
      margin-top: 6px;
      color: #f87171;
      font-size: 10px;
      overflow-wrap: anywhere;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>✨ Fovea MV</span>
    </div>
    <span class="badge">9:16 动效 MP4</span>
  </div>

  <div class="card">
    <div class="card-title">当前检测歌曲</div>
    <div class="song-name" id="songName">正在检测播放中歌曲...</div>
    <div class="status-row" id="publishStatus"></div>
  </div>

  <button class="btn-primary" id="btnExport" disabled>
    <span>🎬 一键生成 9:16 MV</span>
  </button>

  <button class="btn-secondary" id="btnDownloadMp3" style="display: none;" disabled>
    <span>🎵 下载原版 MP3</span>
  </button>
  <div class="status-row" id="downloadStatus" role="status" aria-live="polite" style="display: none;"></div>

  <button class="btn-secondary" id="btnResumeVideo" style="margin-top: 8px;" hidden>恢复上次视频任务</button>
  <select id="jobSelect" aria-label="Video jobs" hidden></select>
  <p style="font-size:11px;margin-top:6px;display:flex;gap:12px;justify-content:center;">
    <a id="openEditor" hidden target="_blank" rel="noopener">歌词动效编辑器 ↗</a>
    <a id="openMotion" hidden target="_blank" rel="noopener">Motion Studio ↗</a>
  </p>
  <div class="status-row" id="videoTaskStatus" role="status" aria-live="polite"></div>
  <div class="status-row" id="recentDownload" role="status" aria-live="polite"></div>
  <button class="node-btn" id="btnRetryDownload" hidden>重试下载</button>

  <!-- 静默自动同步账号状态栏 -->
  <div class="auth-bar" id="authSection">
    <div class="auth-left">
      <span style="color:#94a3b8;font-size:11px;">官网账号</span>
      <span id="authBadge" class="badge" style="background: rgba(148, 163, 184, 0.15); color: #94a3b8; border-color: rgba(148, 163, 184, 0.25);">未登录</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span class="auth-status-text" id="authStatus">登录 mv.fovea.si 自动连接</span>
      <button type="button" class="node-btn" id="btnSyncAuth" title="手动从官网同步">同步</button>
    </div>
    <button type="button" id="btnToggleManualToken" hidden></button>
    <div id="manualTokenBox" hidden>
      <input type="password" id="tokenInput" />
      <button type="button" id="btnSaveToken"></button>
      <button type="button" id="btnClearToken"></button>
    </div>
  </div>

  <div class="footer-actions">
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="hideBar" style="accent-color:#6366f1;" /> 隐藏网页浮窗
    </label>
    <button type="button" class="link-btn" id="btnClearHistory">清空历史任务</button>
  </div>

  <!-- 高级自定义服务（默认折叠隐藏，开发者专属，普通用户无感知） -->
  <details class="advanced-drawer" id="advancedSettings">
    <summary>⚙️ 高级自定义服务</summary>
    <div class="advanced-body">
      <div class="node-header">
        <label>服务端节点:</label>
        <div class="node-btns">
          <button type="button" id="btnCloudNode" class="node-btn active">☁️ 官方云端</button>
          <button type="button" id="btnLocalNode" class="node-btn">💻 本地服务</button>
        </div>
      </div>
      <div class="server-input-group">
        <input type="text" class="input-server" id="serverInput" value="https://mv.fovea.si" spellcheck="false" />
        <button type="button" class="btn-save-server" id="btnSaveServer">保存</button>
      </div>
      <div class="status-row" id="serverStatus" role="status"></div>
    </div>
  </details>

  <details id="errorDetails" hidden>
    <summary>错误详情</summary>
    <div id="errorText"></div>
  </details>

  <div class="footer-tip" id="footerTip">
    生成 MV 与下载 MP3 需确保歌曲已公开 (Publish)。
  </div>

  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
