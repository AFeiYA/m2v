<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Fovea MV 动效视频助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-weight: 600;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .song-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-row {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 500;
    }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }
    .settings-row {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
    }
    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .node-btns {
      display: flex;
      gap: 4px;
    }
    .node-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .node-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .node-btn.active {
      background: rgba(99, 102, 241, 0.35);
      border-color: #6366f1;
      color: #a5b4fc;
      font-weight: 600;
    }
    .input-server {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 4px;
    }
    .footer-tip {
      font-size: 11px;
      color: #64748b;
      margin-top: 12px;
      line-height: 1.4;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>✨ Fovea MV</span>
    </div>
    <span class="badge">9:16 动效 MP4</span>
  </div>

  <div class="card">
    <div class="card-title">当前检测到的歌曲</div>
    <div class="song-name" id="songName">正在检测播放中歌曲...</div>
    <div class="status-row" id="publishStatus"></div>
  </div>

  <button class="btn-primary" id="btnExport" disabled>
    <span>🎬 一键生成 9:16 动效 MP4</span>
  </button>

  <button class="btn-primary" id="btnDownloadMp3" style="margin-top: 8px; background: #334155; box-shadow: none;" disabled>
    🎵 下载原曲 MP3
  </button>
  <div class="status-row" id="downloadStatus" role="status" aria-live="polite"></div>

  <div class="settings-row">
    <div class="node-header">
      <label>后台服务节点:</label>
      <div class="node-btns">
        <button type="button" id="btnCloudNode" class="node-btn active">☁️ 云端生产</button>
        <button type="button" id="btnLocalNode" class="node-btn">💻 本地开发</button>
      </div>
    </div>
    <input type="text" class="input-server" id="serverInput" value="https://mv.fovea.si" />
  </div>

  <div class="footer-tip" id="footerTip">
    💡 提示：MP3 下载无需后台服务，需页面提供可访问的 MP3 音频地址。视频生成仅支持已公开发布 (Publish) 的曲目。未公开曲目请在 Suno 歌曲右侧菜单（...）中点击【Publish】公开后再试。视频合成后将自动保存到本地下载目录。
  </div>

  <script src="popup.js"></script>
</body>
</html>
