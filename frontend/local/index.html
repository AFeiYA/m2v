<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M2V 歌词与字幕对齐编辑器</title>
  <script src="/static/wavesurfer.min.js"></script>
  <link rel="stylesheet" href="/static/style.css?v=20260921e">
</head>

<body>
  <header>
    <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
      <h1 style="font-size: 14px; font-weight: bold; white-space: nowrap; margin: 0;">🎤 M2V 歌词</h1>
      <!-- 快捷 Suno 导入栏 -->
      <div id="suno-quick-bar" style="display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.25); padding: 2px 4px; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0;">
        <input id="suno-url-input" type="text" placeholder="粘贴 Suno 歌曲链接..."
               style="width: 210px; height: 24px; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 11px; outline: none;"
               onkeydown="if(event.key==='Enter') handleSunoImport()" />
        <button id="btn-start-suno-import" onclick="handleSunoImport()" title="一键抓取并字级对齐"
                style="background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; font-weight: 600; border: none; height: 24px; padding: 0 8px; border-radius: 3px; cursor: pointer; font-size: 11px; white-space: nowrap; flex-shrink: 0;">⚡ 导入对齐</button>
      </div>
    </div>

    <div id="song-selector" style="flex-shrink: 0;">
      <select id="song-select" style="min-width: 140px; max-width: 180px;">
        <option value="">加载中…</option>
      </select>
    </div>

    <div id="toolbar">
      <button id="btn-save" title="保存修改 (Ctrl+S)">💾 保存</button>
      <button id="btn-undo" title="Ctrl+Z">↩ 撤销</button>
      <button id="btn-redo" title="Ctrl+Y">↪ 重做</button>
      <span class="sep">|</span>
      <button id="btn-regen-ass" style="background: linear-gradient(135deg, #3b82f6, #2563eb); font-weight: 600;" title="从当前字级时间戳重新生成 ASS 字幕">📝 生成 ASS</button>
      <span class="sep">|</span>
      <a href="/storyboard" target="_blank" style="color: #61afef; text-decoration: none; font-size: 12px; height: 28px; line-height: 26px; padding: 0 8px; border: 1px solid #61afef44; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex-shrink: 0;" title="前往下游制作图片素材与视频合成">🎬 分镜制作 ↗</a>
      <span class="sep">|</span>
      <span id="status-msg"></span>
    </div>
  </header>

  <main>
    <section id="waveform-section">
      <!-- 人声轨 -->
      <div class="track-row" id="track-vocals">
        <div class="track-label">
          <button class="track-mute-btn active" id="btn-mute-vocals" title="静音/取消静音人声轨">🎤 人声</button>
        </div>
        <div class="track-waveform" id="waveform-vocals"></div>
      </div>
      <!-- 乐器轨 -->
      <div class="track-row" id="track-instrumental">
        <div class="track-label">
          <button class="track-mute-btn active" id="btn-mute-instrumental" title="静音/取消静音乐器轨">🎸 伴奏</button>
        </div>
        <div class="track-waveform" id="waveform-instrumental"></div>
      </div>
      <div id="waveform-controls">
        <button id="btn-play-pause" title="Space">▶ 播放</button>
        <button id="btn-play-line" title="Enter">▶ 播放选中行</button>
        <span id="time-display">0:00.000 / 0:00.000</span>
        <label style="font-size: 12px; color: var(--text-dim); margin-left: 10px;">缩放: <input id="zoom-slider" type="range" min="10" max="500" value="50"></label>
      </div>
    </section>

    <div id="editor-container">
      <!-- 左栏：歌词行列表与整行微调 -->
      <section id="lyrics-panel" style="width: 42%;">
        <div id="lyrics-list"></div>
      </section>

      <!-- 右栏：纯粹开阔的字级时间轴面板 -->
      <section id="word-panel" style="flex: 1; display: flex; flex-direction: column;">
        <div id="word-panel-header" style="display: flex; justify-content: space-between; align-items: center;">
          <span id="word-panel-title">点击左侧歌词行展开字级时间轴</span>
          <div id="line-edit-controls" style="display:none">
            <span style="font-size: 11px; color: var(--text-dim); margin-right: 4px;">整行:</span>
            <button id="btn-line-nudge-left-big" title="整行前移 200ms">⬅ -200ms</button>
            <button id="btn-line-nudge-left" title="整行前移 50ms">◁ -50ms</button>
            <button id="btn-line-nudge-right" title="整行后移 50ms">▷ +50ms</button>
            <button id="btn-line-nudge-right-big" title="整行后移 200ms">➡ +200ms</button>
            <span class="sep">|</span>
            <button id="btn-line-expand" title="行时长+100ms">↔ 展开</button>
            <button id="btn-line-shrink" title="行时长-100ms">⇿ 收缩</button>
          </div>
        </div>

        <!-- 宽敞的字级时间轴拖拽区域 -->
        <div id="word-timeline" style="flex: 1; min-height: 280px; overflow-x: auto; overflow-y: hidden; padding: 20px; position: relative; background: #0f141c;"></div>

        <!-- 单字精调工具栏 -->
        <div id="word-controls">
          <span style="font-size: 11px; color: var(--text-dim); margin-right: 4px;">选中字微调:</span>
          <button id="btn-shift-left" title="快捷键 A">⬅ -50ms</button>
          <button id="btn-nudge-left" title="快捷键 ←">◁ -10ms</button>
          <button id="btn-nudge-right" title="快捷键 →">▷ +10ms</button>
          <button id="btn-shift-right" title="快捷键 D">➡ +50ms</button>
          <span class="sep">|</span>
          <button id="btn-even-split">⚖ 均分整行时值</button>
          <button id="btn-play-word">▶ 试听选中字</button>
        </div>
      </section>
    </div>
  </main>

  <!-- 导入进度提示浮层 -->
  <div id="suno-import-progress" style="display: none; position: fixed; bottom: 20px; right: 20px; z-index: 99999; padding: 14px 20px; background: #1f232b; border-left: 4px solid #ff4b2b; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: 8px; font-size: 13px; color: #eceff4;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 18px;">⏳</span>
      <span id="suno-progress-text">正在从 Suno 提取歌曲信息与歌词...</span>
    </div>
  </div>

  <script src="/static/common.js?v=20260922a"></script>
  <script src="/static/lyric_editor.js?v=20260922a"></script>
</body>

</html>
