<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Studio · m2v</title><link rel="stylesheet" href="/motion-lab.css"></head>
<body>
  <header><div class="brand"><b class="mark">M</b><div><strong>Motion Studio</strong><small>歌曲 → 动效导演 → MP4</small></div></div><div class="header-right"><button id="focus-preview">放大预览</button><a href="/">歌词编辑器 ↗</a><a href="/motion_lab">实验室 ↗</a></div></header>
  <main><section class="stage-wrap"><div class="stage-top"><div><span class="eyebrow">LIVE CANVAS</span><strong id="track-name">选择歌曲开始制作</strong></div><span id="stage-meta">16:9 · 1280×720</span></div>
    <div id="stage-box"><canvas id="stage" width="1280" height="720"></canvas><div id="stage-error" hidden></div><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
    <div class="transport"><button id="play" class="play">▶</button><span id="time">00:00.00</span><input id="seek" type="range" min="0" max="18" step="0.01" value="0"><span id="duration">00:18.00</span><span class="transport-hint">可拖动时间轴逐帧检查</span></div>
    <div class="status"><span class="tag">动效导演</span><span id="status">准备就绪</span><span id="line-status"></span></div>
  </section>
<aside><div class="side-head"><h1>字幕动效制作</h1><p>选择歌曲，生成导演方案，预览并输出完整视频。</p></div><div class="side-scroll">
<section class="panel"><h2>01 / 歌曲与画幅</h2><select id="project-select"><option value="">选择歌曲…</option></select><p id="analysis-status" class="help">请选择已有对齐工程</p><label for="aspect">画幅</label><select id="aspect"><option value="16:9">横屏 16:9</option><option value="9:16">竖屏 9:16</option></select><label for="resolution">分辨率</label><select id="resolution"><option value="720">720p</option><option value="360">360p 快速测试</option></select></section>
<section class="panel"><h2>02 / 动效导演</h2><label for="preset">偏好色调</label><select id="preset"><option value="impact">荧绿 · 高对比</option><option value="neon">霓虹 · 冷蓝</option></select><button id="generate" class="primary">自动生成导演方案</button><button id="director-input" class="secondary">下载 LLM 导演提示词</button><details><summary>导入 LLM 返回方案</summary><textarea id="llm-return" placeholder="粘贴 LLM 返回的导演 JSON" style="width:100%;height:130px"></textarea><button id="import-plan">校验并应用方案</button></details><button id="download-plan" class="secondary">下载当前方案 JSON</button></section>
<section class="panel"><h2>03 / 逐句调整</h2><label for="cue-select">歌词句子</label><select id="cue-select"></select><label for="cue-template">动画</label><select id="cue-template"><option value="word-impact">逐字／词击打</option><option value="phrase-rise">整句上浮</option><option value="quiet-hold">整句静置</option></select><label for="cue-layout">布局</label><select id="cue-layout"><option value="center">居中</option><option value="left">歌词左对齐</option></select><label for="cue-palette">色调</label><select id="cue-palette"><option value="impact">荧绿</option><option value="neon">冷蓝</option></select><label for="cue-emphasis">强调词（原歌词中的文字）</label><input id="cue-emphasis" type="text"><label for="cue-intensity">动画强度</label><input id="cue-intensity" type="range" min="0" max="1" step="0.05" value="0.5"><label class="check"><input id="cue-locked" type="checkbox">锁定此句，重新导演时保留</label><button id="regenerate-cue" class="secondary">重新导演此句</button><button id="save-plan" class="primary">保存方案</button></section>
<section class="panel"><h2>04 / 画面质感</h2><label class="check"><input id="post" type="checkbox" checked>辉光 / 光晕 / 胶片颗粒</label><label for="bloom">辉光</label><input id="bloom" type="range" min="0" max="1.4" step="0.05" value="0.7"><label for="shake">震动</label><input id="shake" type="range" min="0" max="1.5" step="0.05" value="0.65"></section>
<section class="panel export"><h2>05 / 导出 MP4</h2><label for="export-range">范围</label><select id="export-range"><option value="full">完整歌曲</option><option value="clip">指定片段</option></select><label for="clip-start">片段起点 / 秒</label><input id="clip-start" type="number" min="0" step="0.1" value="0"><label for="clip-length">片段长度 / 秒</label><input id="clip-length" type="number" min="0.1" step="0.1" value="8"><button id="export" class="primary">导出 MP4</button><button id="cancel" hidden>取消导出</button><p id="export-status" class="help">使用当前导演方案和原曲，30fps / H.264。</p><a id="download" hidden download>下载成片 ↓</a><div id="export-history" class="help"></div></section></div></aside></main>
  <script type="module" src="/motion/studio.js"></script>
</body></html>
