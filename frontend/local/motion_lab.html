<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Lab · m2v</title><link rel="stylesheet" href="/motion-lab.css"></head>
<body>
  <header><div class="brand"><b class="mark">M</b><div><strong>Motion Lab</strong><small>m2v / WEBGL EXPERIMENT</small></div></div><div class="header-right"><span class="beta">集成测试</span><a href="/motion_studio" title="完整导演与导出">Motion Studio ↗</a></div></header>
  <main><section class="stage-wrap"><div class="stage-top"><div><span class="eyebrow">LIVE CANVAS</span><strong id="track-name">让文字跟着节奏 · 合成节奏演示</strong></div><span id="stage-meta">16:9 · 1280×720</span></div>
    <div id="stage-box"><canvas id="stage" width="1280" height="720"></canvas><div id="stage-error" hidden></div><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
    <div class="transport"><button id="play" class="play">▶</button><span id="time">00:00.00</span><input id="seek" type="range" min="0" max="18" step="0.01" value="0"><span id="duration">00:18.00</span><span class="transport-hint">可拖动时间轴逐帧检查</span></div>
    <div class="status"><span id="source-type" class="tag">合成节奏演示</span><span id="status">准备就绪</span><span id="line-status"></span></div>
  </section>
  <aside><div class="side-head"><span class="eyebrow">PROJECT SETUP</span><h1>调试画面</h1><p>先听节奏，再调整画面。更改设置会立即更新预览。</p></div>
    <div class="side-scroll"><section class="panel"><h2>01 / 歌曲</h2><label for="project-select">仓库已有工程</label><select id="project-select"><option value="">选择工程…</option></select><button id="demo" class="secondary">载入演示节奏</button><div class="split-label">或从电脑选择</div><label class="filepick">选择 alignment.json<input id="json-file" type="file" accept=".json,application/json"></label><label class="filepick">选择对应音频<input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg"></label><p class="help">请选原曲音频；示例鼓点是合成的，不能用于评价自动识别精度。</p></section>
    <section class="panel"><h2>02 / 动效</h2><label for="mode">排版节奏</label><select id="mode"><option value="slam">逐字重击</option><option value="phrase">整句展开</option></select><label for="preset">画面色调</label><select id="preset"><option value="impact">荧绿 · 高对比</option><option value="neon">霓虹 · 冷蓝</option></select><label for="aspect">画幅</label><select id="aspect"><option value="16:9">横屏 16:9</option><option value="9:16">竖屏 9:16</option></select><label class="check"><input id="post" type="checkbox" checked> Pdoom 后处理（辉光 / 光晕 / 胶片颗粒）</label><div class="slider"><label for="punch">文字冲击 <output id="punch-value">0.7</output></label><input id="punch" type="range" min="0" max="1.5" step="0.05" value="0.7"></div><div class="slider"><label for="bloom">辉光 <output id="bloom-value">0.7</output></label><input id="bloom" type="range" min="0" max="1.4" step="0.05" value="0.7"></div><div class="slider"><label for="shake">镜头震动 <output id="shake-value">0.65</output></label><input id="shake" type="range" min="0" max="1.5" step="0.05" value="0.65"></div></section>
    <section class="panel export"><h2>03 / 导出短片</h2><label for="clip-start">起点 / 秒</label><input id="clip-start" type="number" min="0" step="0.1" value="0"><label for="clip-length">长度 / 秒（最多 15）</label><input id="clip-length" type="number" min="1" max="15" step="1" value="8"><button id="export" class="primary">前往 Studio 导出</button><p id="export-status" class="help">固定 30fps、H.264；离线逐帧渲染需要一点时间。</p><a id="download" hidden download>下载成片 ↓</a></section></div>
  </aside></main>
  <script type="module" src="/motion/lab.js"></script>
</body></html>
