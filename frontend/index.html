<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M2V — 卡拉OK视频生成器</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>

  <!-- ========== 登录/注册弹窗 ========== -->
  <div id="auth-overlay" class="overlay">
    <div class="auth-card">
      <h2 id="auth-title">🎤 M2V 登录</h2>
      <div class="google-auth-section" style="margin-bottom: 16px;">
        <button type="button" id="btn-google-login" class="btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; color: #3c4043; border: 1px solid #dadce0; border-radius: 6px; padding: 10px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(60,64,67,0.2);">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.347 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
          Google 账号一键登录
        </button>
        <div style="display: flex; align-items: center; margin: 14px 0 8px 0; color: #888;">
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.15);"></div>
          <span style="padding: 0 10px; font-size: 12px; color: #aaa;">或使用账号密码</span>
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.15);"></div>
        </div>
      </div>
      <form id="auth-form">
        <input id="auth-username" type="text" placeholder="用户名" autocomplete="username" style="display:none">
        <input id="auth-email" type="email" placeholder="邮箱" required autocomplete="email">
        <input id="auth-password" type="password" placeholder="密码 (至少6位)" required autocomplete="current-password">
        <button type="submit" id="auth-submit">登录</button>
      </form>
      <p class="auth-switch">
        <span id="auth-toggle-text">没有账号？</span>
        <a href="#" id="auth-toggle">去注册</a>
      </p>
      <div style="margin-top: 10px; font-size: 12px; text-align: center; color: #888;">
        <span>后端服务: </span>
        <a href="#" id="btn-config-api" style="color: #4285F4; text-decoration: underline;">配置 API 地址</a>
      </div>
      <p id="auth-error" class="error-text"></p>
    </div>
  </div>

  <!-- ========== 主界面 ========== -->
  <div id="app" style="display:none">
    <!-- 顶部导航 -->
    <header>
      <div class="header-left">
        <h1>🎤 M2V</h1>
        <span class="subtitle">卡拉OK视频生成器</span>
      </div>
      <div class="header-right">
        <span id="user-info"></span>
        <span id="user-credits" class="badge"></span>
        <a href="/editor" target="_blank" class="btn btn-sm">📝 时间轴编辑器</a>
        <button id="btn-config-api-app" class="btn btn-sm btn-outline" title="设置后端 API 地址">⚙️ API</button>
        <button id="btn-logout" class="btn btn-sm btn-outline">退出</button>
      </div>
    </header>

    <!-- 上传区 -->
    <section id="upload-section">
      <div class="upload-card">
        <h2>🎵 上传音乐 + 歌词</h2>
        <form id="upload-form">
          <div class="upload-row">
            <div class="upload-field">
              <label for="file-mp3">音频文件 (MP3/WAV)</label>
              <input type="file" id="file-mp3" accept=".mp3,.wav,.flac" required>
            </div>
            <div class="upload-field">
              <label for="file-lyrics">歌词文件 (TXT/LRC)</label>
              <input type="file" id="file-lyrics" accept=".txt,.lrc" required>
            </div>
          </div>
          <div class="upload-options">
            <label><input type="checkbox" id="opt-skip-sep"> 跳过人声分离 (已是纯人声)</label>
            <label><input type="checkbox" id="opt-ass-only"> 只生成 ASS 字幕</label>
            <label><input type="checkbox" id="opt-beat"> 节奏动画</label>
            <select id="opt-lang">
              <option value="zh">中文</option>
              <option value="en">英文</option>
              <option value="ja">日文</option>
              <option value="ko">韩文</option>
            </select>
          </div>
          <button type="submit" id="btn-upload" class="btn btn-primary">
            🚀 上传并生成
          </button>
        </form>
      </div>
    </section>

    <!-- 任务列表 -->
    <section id="tasks-section">
      <div class="section-header">
        <h2>📋 我的任务</h2>
        <button id="btn-refresh" class="btn btn-sm">🔄 刷新</button>
      </div>
      <div id="tasks-list"></div>
      <div id="tasks-empty" class="empty-state" style="display:none">
        <p>还没有任务，上传音频开始吧！</p>
      </div>
    </section>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
